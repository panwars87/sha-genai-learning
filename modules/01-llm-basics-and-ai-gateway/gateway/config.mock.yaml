# LiteLLM AI gateway — Module 01, MOCK mode.
#
# The same aliases as config.yaml, but every model returns a canned reply (`mock_response`)
# instead of calling Anthropic or OpenAI. Use it to:
#   - try every lesson for free while you learn the plumbing,
#   - run demos without vendor keys.
# Virtual keys, budgets and cost headers still work (cost is computed from fake token counts).
#
# Start it with:  make gateway-mock MODULE=01
#
# Generated from config.yaml. If you change that file, mirror the change here.

model_list:
- model_name: fast-anthropic
  litellm_params:
    model: anthropic/claude-haiku-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    mock_response: '[MOCK reply from fast-anthropic] The gateway answered without calling a real model.
      Switch to `make gateway` to use real models.'
- model_name: smart-anthropic
  litellm_params:
    model: anthropic/claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    mock_response: '[MOCK reply from smart-anthropic] The gateway answered without calling a real model.
      Switch to `make gateway` to use real models.'
- model_name: fast-openai
  litellm_params:
    model: openai/gpt-6-luna
    api_key: os.environ/OPENAI_API_KEY
    mock_response: '[MOCK reply from fast-openai] The gateway answered without calling a real model. Switch
      to `make gateway` to use real models.'
- model_name: smart-openai
  litellm_params:
    model: openai/gpt-6.1-sol
    api_key: os.environ/OPENAI_API_KEY
    mock_response: '[MOCK reply from smart-openai] The gateway answered without calling a real model.
      Switch to `make gateway` to use real models.'
router_settings:
  model_group_alias:
    fast: fast-anthropic
    smart: smart-anthropic
litellm_settings:
  num_retries: 2
  request_timeout: 60
  drop_params: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
