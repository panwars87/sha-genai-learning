[project]
name = "documind"
version = "0.1.0"
description = "DocuMind: intelligent document processing (Module 01: LLM basics + AI gateway)"
requires-python = ">=3.12"
dependencies = [
    "litellm==1.108.0",          # the AI gateway, used as a library (no server to run)
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2", # typed settings from YAML + environment
    "python-dotenv==1.2.4",      # loads your keys from .env
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]
notebook = ["jupyterlab==4.4.10"]   # to open the module notebook on your Mac

[tool.uv]
default-groups = ["dev", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*ReadOnly.*:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
