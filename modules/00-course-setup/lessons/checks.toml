# What the setup checks look for. Edit here, not in the scripts.

[tools]
python_min = "3.12"
required = ["uv", "git"]
optional = ["make"]     # handy on Mac; not needed in Colab

[env_file]
# Names that must have a value in .env. The check never prints or uses the values.
required = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "LITELLM_MASTER_KEY", "DATABASE_URL"]
master_key_prefix = "sk-"
# Created later, in Module 01 lesson L04:
later = ["DOCUMIND_API_KEY"]

[data]
folders = ["invoices", "receipts"]
preview_lines = 6
