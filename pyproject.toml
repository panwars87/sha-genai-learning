[project]
name = "documind"
version = "0.3.0"
description = "DocuMind: an intelligent document processing app, built one GenAI concept at a time"
requires-python = ">=3.12"
dependencies = [
    "litellm==1.108.0",          # one client for every vendor; the gateway from Module 2
    "pydantic==2.14.2",          # typed data at every boundary (LLM output, files)
    "pydantic-settings==2.16.2", # typed settings from YAML + environment
    "python-dotenv==1.2.4",      # loads your keys from .env
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["documind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*ReadOnly.*:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"modules/**/*.py" = ["E402"]   # lesson scripts import after their explanatory docstring/setup
