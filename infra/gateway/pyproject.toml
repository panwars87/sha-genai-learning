# The AI gateway's own environment, kept separate from DocuMind on purpose:
# the gateway is infrastructure, the app is a client of it.
[project]
name = "documind-gateway"
version = "0.1.0"
description = "LiteLLM proxy (AI gateway) for the DocuMind course"
requires-python = ">=3.12"
dependencies = [
    # proxy = the gateway server; extra_proxy = Prisma, needed for virtual keys in Postgres
    "litellm[proxy,extra_proxy]==1.108.0",
]

[tool.uv]
package = false
